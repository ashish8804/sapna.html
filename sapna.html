<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Anniversary Abhishek & Sapna</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://www.instagram.com/aanya__687?igsh=MTltdGhwbzA4dzFyMQ==">
<style>

body {
    margin: 0;
    padding: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg,#1e3c72,#2a5298);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    color: white;
}

/* Soft floating lights */
.light {
    position: absolute;
    width: 10px;
    height: 10px;
    background: rgba(255,255,255,0.5);
    border-radius: 50%;
    animation: float 8s linear infinite;
}

@keyframes float {
    0% { transform: translateY(100vh); opacity: 0; }
    50% { opacity: 1; }
    100% { transform: translateY(-10vh); opacity: 0; }
}

.card {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(15px);
    padding: 40px;
    border-radius: 25px;
    text-align: center;
    width: 90%;
    max-width: 520px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    animation: fadeIn 2s ease;
}

.photo {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid white;
    margin-bottom: 20px;
}

h1 {
    font-family: 'Playfair Display', serif;
    font-size: 32px;
    margin-bottom: 10px;
}

.names {
    font-size: 26px;
    font-weight: 500;
    letter-spacing: 1px;
    margin-bottom: 15px;
}

.names span {
    color: #ffd700;
}

p {
    font-size: 16px;
    line-height: 1.6;
    margin-bottom: 20px;
}

#countdown {
    font-size: 18px;
    margin-bottom: 20px;
    color: #ffd700;
}

/* Button */
button {
    padding: 12px 25px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(45deg,#ff416c,#ff4b2b);
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.4s;
}

button:hover {
    transform: scale(1.05);
}

#surprise {
    margin-top: 20px;
    display: none;
    font-size: 18px;
    animation: fadeIn 1s ease-in-out;
    color: #ffd700;
}

@keyframes fadeIn {
    from {opacity:0; transform:translateY(20px);}
    to {opacity:1; transform:translateY(0);}
}

@media(max-width:600px){
    h1 {font-size:24px;}
    .names {font-size:20px;}
}

</style>
</head>

<body>

<!-- Background Music -->
<audio autoplay loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- Floating Lights -->
<div class="light" style="left:10%; animation-delay:1s;"></div>
<div class="light" style="left:25%; animation-delay:3s;"></div>
<div class="light" style="left:50%; animation-delay:5s;"></div>
<div class="light" style="left:70%; animation-delay:2s;"></div>
<div class="light" style="left:85%; animation-delay:4s;"></div>

<div class="card">

    <img src="photo.jpg" alt="Abhishek & Sapna" class="photo">

    <h1>Happy Wedding Anniversary 🎉</h1>

    <div class="names">
        <span>Abhishek</span> ❤️ <span>Sapna</span>
    </div>

    <p>
        Aap dono ka pyaar hamesha aise hi roshan rahe ✨  
        Zindagi ke har mod par ek dusre ka saath bana rahe ❤️
    </p>

    <div id="countdown"></div>

    <button onclick="showSurprise()">Open Special Message 🎁</button>

    <div id="surprise">
        💖 Aap dono ek dusre ke liye bane ho.  
        Bhagwan aapko hamesha khush rakhe! 💞
    </div>

</div>

<script>

// Countdown Date Change Here
var countDate = new Date("March 5, 2026 00:00:00").getTime();

var x = setInterval(function() {

    var now = new Date().getTime();
    var distance = countDate - now;

    var days = Math.floor(distance / (1000 * 60 * 60 * 24));
    var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    var seconds = Math.floor((distance % (1000 * 60)) / 1000);

    document.getElementById("countdown").innerHTML =
        "Next Anniversary in: " + days + "d "
        + hours + "h " + minutes + "m " + seconds + "s ";

    if (distance < 0) {
        clearInterval(x);
        document.getElementById("countdown").innerHTML = "🎉 Happy Anniversary 🎉";
    }

}, 1000);

function showSurprise(){
    document.getElementById("surprise").style.display = "block";
}

</script>

</body>
</html>
